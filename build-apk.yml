name: Compilar APK

# Se ejecuta automáticamente cada vez que subes cambios a la rama "main"
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # también permite darle "Run workflow" manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        run: gradle assembleDebug

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
